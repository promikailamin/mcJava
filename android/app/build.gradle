plugins {
    id 'com.android.application'
}

def minecraftVersion = "26.3"
def loaderVersion = "0.19.5"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace 'pro.minecraft'
    compileSdk 35

    defaultConfig {
        applicationId "pro.minecraft"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "${minecraftVersion}-fabric-${loaderVersion}"
        multiDexEnabled true
    }

    compileOptions {
        // The 26.3 source tree uses record patterns and pattern-matching switch
        // (sealed Uniform instances, HoverEvent ShowText, ...) -> needs JDK 21+.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties',
                'META-INF/org/apache/logging/log4j/**',
                'META-INF/native-image/**',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/versions/**',
                'module-info.class'
            ]
            merges += 'META-INF/services/**'
        }
    }

    dexOptions {
        preDexLibraries true
        jumboMode true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    tasks.withType(JavaCompile).configureEach {
        // Keep compiling after the default 100-error cap so the whole error surface
        // is visible in a single pass while porting the tree.
        options.compilerArgs << "-Xmaxerrs" << "100000"
        options.fork = true
        
        // Add MatchException to java.lang module via patch-module
        def matchExceptionJar = file('../../matchexception/matchexception.jar')
        if (matchExceptionJar.exists()) {
            options.compilerArgs << "--patch-module=java.lang=" + matchExceptionJar.absolutePath
            // Also add to classpath as fallback
            doFirst {
                classpath = classpath + files(matchExceptionJar)
            }
        }
        
        // Debug: print source files count without filtering
        doFirst {
            println "Source files (no filter): ${source.files.size()}"
            source.files.each { f ->
                if (f.path.contains('net/minecraft/client') || f.path.contains('com/mojang/blaze3d') || f.path.contains('org/lwjgl')) {
                    println "INCLUDED (should be excluded): ${f.path}"
                }
            }
        }
        // Don't use jrt-fs.jar as it interferes with module system
    }

task printSourceFiles {
    doLast {
        sourceSets.main.java.srcDirs.each { dir ->
            println "Source dir: $dir"
            fileTree(dir).include("**/*.java").each { file ->
                println "  ${file.path}"
            }
        }
    }
}

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
                exclude '**/net/minecraft/client/**'
                exclude '**/com/mojang/blaze3d/**'
                exclude '**/com/mojang/renderpearl/**'
                exclude '**/com/mojang/realmsclient/**'
                exclude '**/com/mojang/text2speech/**'
                exclude '**/org/lwjgl/**'
                exclude '**/net/minecraft/realms/**'
                exclude '**/net/fabricmc/**'
                exclude '**/stubs/**'
                exclude '**/pro/minecraft/launch/**'
                exclude '**/pro/minecraft/main_activity.java'
                exclude '**/pro/minecraft/host/**'
                exclude '**/net/minecraft/util/profiling/jfr/event/**'
                exclude '**/net/minecraft/util/profiling/jfr/parse/**'
                exclude '**/net/minecraft/util/profiling/jfr/serialize/**'
                exclude '**/net/minecraft/util/profiling/jfr/stats/**'
                exclude '**/net/minecraft/util/profiling/jfr/JfrProfiler.java'
                exclude '**/net/minecraft/util/profiling/jfr/SummaryReporter.java'
                exclude '**/net/minecraft/server/gui/**'
                exclude '**/net/minecraft/util/monitoring/jmx/**'
                exclude '**/com/mojang/renderpearl/backend/vulkan/**'
            }
        }
    }
}

dependencies {
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.2.0'

    // --- Minecraft runtime (pure-Java libraries from the 26.3 library list) ---
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'io.netty:netty-buffer:4.2.16.Final'
    implementation 'io.netty:netty-codec-base:4.2.16.Final'
    implementation 'io.netty:netty-codec-compression:4.2.16.Final'
    implementation 'io.netty:netty-codec-http:4.2.16.Final'
    implementation 'io.netty:netty-common:4.2.16.Final'
    implementation 'io.netty:netty-handler:4.2.16.Final'
    implementation 'io.netty:netty-resolver:4.2.16.Final'
    implementation 'io.netty:netty-transport:4.2.16.Final'
    implementation 'io.netty:netty-transport-classes-epoll:4.2.16.Final'
    implementation 'io.netty:netty-transport-classes-kqueue:4.2.16.Final'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.joml:joml:1.10.9'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'commons-codec:commons-codec:1.22.0'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'com.ibm.icu:icu4j:78.3'
    implementation 'com.github.oshi:oshi-core:6.9.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'org.jcraft:jorbis:0.0.17'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'org.jetbrains:annotations:26.0.2'
    // javax.annotation.* and javax.annotation.concurrent.* referenced by the
    // decompiled sources (BlockPos, BlockableEventLoop, ...).
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'com.mojang:brigadier:1.3.11'
    implementation 'com.mojang:authlib:10.0.77'
    implementation 'com.mojang:datafixerupper:10.0.21'
    implementation 'com.mojang:blocklist:1.0.10'
    implementation 'com.mojang:logging:1.7.12'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    

    // Minecraft's JVM-side window/GL bindings (org.lwjgl) are replaced by the
    // Android shim in this repository (org/lwjgl -> EGL / OpenGL ES 3.2).
}
