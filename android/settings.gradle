pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Mojang's own Maven repo hosting com.mojang artifacts (authlib, brigadier,
        // datafixerupper, blocklist, logging).
        maven { url = uri('https://libraries.minecraft.net/') }
    }
}

rootProject.name = "minecraft"
include ':app'