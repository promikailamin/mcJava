name: Issue Workflow

on:
    issues:
        types: [opened]

permissions:
    contents: write
    issues: read

jobs:
    preserve_files:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify repository files
              run: |
                  echo "Issue created: ${{ github.event.issue.number }}"
                  echo "Repository: ${{ github.repository }}"
                  git status --short
                  git ls-files

            - name: Preserve files without changes
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "All tracked files remain unchanged."
                      echo "No commit or push is necessary."
                  else
                      echo "Changes detected. No files will be modified."
                      exit 1
                  fi
