name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm i -g opencode-ai@latest

      - name: Restore opencode session
        run: |
          mkdir -p ~/.opencode/sessions
          if [ -f opencode-session.json ]; then
            cp opencode-session.json ~/.opencode/sessions/latest.json
            echo "Restored opencode session"
          else
            echo "No existing session found"
          fi

      - name: Configure opencode
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.jsonc << 'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle"
          }
          JSON

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> $GITHUB_OUTPUT
          if [ "$status" -ne 0 ]; then
            grep -E ": error:" build.log | sed -E 's#.*/app/src/main/java/##; s/:[0-9]+: error: / :: /' | sort -u > errors.txt
            echo "=========== UNIQUE COMPILE ERRORS ($(wc -l < errors.txt)) ==========="
            cat errors.txt
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcJava-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Auto-fix build errors with opencode (persistent session)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          
          # Create prompt file
          cat > /tmp/fix_prompt.txt << 'PROMPT'
          Fix compilation errors in mcJava Android build.
          
          Context: This is a persistent opencode session. Previous fixes have been attempted.
          
          Task:
          1. Read android/build.log to see current compilation errors
          2. Fix errors in android/app/src/main/java
          3. Make minimal, targeted fixes
          4. Commit with message: "fix: auto-fix build errors [session]"
          5. Push to current branch
          
          Focus on root cause errors first.
          PROMPT
          
          # Run opencode with prompt from file using stdin
          opencode run --model opencode/big-pickle --yes < /tmp/fix_prompt.txt
          
          # Save session for next run
          cp ~/.opencode/sessions/latest.json opencode-session.json 2>/dev/null || true
          
          # Commit session if changed
          if git diff --quiet opencode-session.json; then
            echo "No session changes"
          else
            git add opencode-session.json
            git commit -m "chore: update opencode session" || true
            git push origin HEAD:$GITHUB_REF_NAME || true
          fi

      - name: Trigger rebuild
        if: failure()
        run: |
          echo "Fixes attempted. Build will retrigger on push."
