name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm i -g opencode-ai@latest

      - name: Restore opencode session
        run: |
          mkdir -p ~/.opencode/sessions
          if [ -f opencode-session.json ]; then
            cp opencode-session.json ~/.opencode/sessions/latest.json
            echo "Restored opencode session"
          else
            echo "No existing session found"
          fi

      - name: Configure opencode
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.jsonc << 'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle"
          }
          JSON

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> $GITHUB_OUTPUT
          if [ "$status" -ne 0 ]; then
            grep -E ": error:" build.log | sed -E 's#.*/app/src/main/java/##; s/:[0-9]+: error: / :: /' | sort -u > errors.txt
            echo "=========== UNIQUE COMPILE ERRORS ($(wc -l < errors.txt)) ==========="
            cat errors.txt
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcJava-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Auto-fix build errors with opencode
        if: failure() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          if [ ! -f android/build.log ]; then
              echo "Build log not found"
              exit 1
          fi

          cat > /tmp/fix_prompt.txt << 'PROMPT'
          Fix compilation errors in the mcJava Android project.

          Instructions:
          1. Read android/build.log and identify the root cause.
          2. Make minimal, targeted fixes.
          3. Run the relevant Gradle build to verify the fixes.
          4. Do not modify unrelated files.
          5. If the build succeeds, commit the changes with:
             fix: auto-fix build errors
          6. Push the commit to the current branch.
          7. If the build still fails, explain the remaining errors.
          PROMPT

          if [ -f opencode-session.json ]; then
              echo "Existing session file found."
          fi

          prompt="$(cat /tmp/fix_prompt.txt)"

          if [ -f opencode-session.json ]; then
              opencode run \
                  --model opencode/big-pickle \
                  --auto \
                  --continue \
                  "$prompt"
          else
              opencode run \
                  --model opencode/big-pickle \
                  --auto \
                  "$prompt"
          fi

          git status --short

      - name: Trigger rebuild
        if: failure()
        run: |
          echo "Fixes attempted. Build will retrigger on push."
