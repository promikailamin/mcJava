name: Auto Fix Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run'
        required: false
        default: 'false'

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm i -g opencode-ai@latest

      - name: Configure opencode
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.jsonc << 'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle"
          }
          JSON

      - name: Wait for current workflow to complete or check status
        run: |
          echo "Checking workflow status..."
          sleep 30

      - name: Run auto-fixer with opencode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/fix-prompt.txt << 'PROMPT'
          You are working on mcJava - a Minecraft Java Edition port to Android.

          Current state: The last commit was trying to fix LevelBasedValue.java to match the original working structure. But there are compilation errors.

          Task: Monitor and fix build errors until the Android build (Build APK) succeeds. 
          
          Workflow:
          1. Check the latest GitHub Actions run for this repo using gh CLI
          2. If there is no running build, or if the last build succeeded, stop (all good)
          3. If the last build failed, get the failed logs, analyze the compilation errors
          4. Fix the errors in the codebase (start with the earliest/root cause errors)
          5. Commit and push the fixes with clear commit messages
          6. The workflow will trigger again on push - this creates a loop until build succeeds
          
          Constraints:
          - Use opencode/big-pickle model
          - Make minimal targeted fixes
          - Commit and push after each fix attempt
          - Focus on fixing compilation errors
          - Do NOT give up - keep iterating
          
          Start by checking the latest workflow run status.
          PROMPT
          opencode --model opencode/big-pickle -p "$(cat /tmp/fix-prompt.txt)" --yes || true

      - name: Check if we should continue loop
        run: |
          # This step allows the workflow to be self-perpetuating
          # If the build is still failing, another push will trigger it again
          echo "Done with this iteration"
